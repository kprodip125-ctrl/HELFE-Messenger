name: Build HELFE Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup app files
        run: |
          mkdir -p /tmp/helfe-backup
          cp pubspec.yaml /tmp/helfe-backup/pubspec.yaml
          cp lib/main.dart /tmp/helfe-backup/main.dart

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name helfe_messenger

      - name: Restore app files
        run: |
          cp /tmp/helfe-backup/pubspec.yaml pubspec.yaml
          cp /tmp/helfe-backup/main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HELFE-Messenger-APK
          path: build/app/outputs/flutter-apk/app-release.apk
